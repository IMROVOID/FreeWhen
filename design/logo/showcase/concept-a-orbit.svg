<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-a">
  <title id="title-a">FreeWhen Concept A — The Meet Point (Orbital Convergence)</title>
  <g fill="none" stroke="#170E0A" stroke-width="36" stroke-linecap="round">
    <!-- Top Arc (sweeping over top, generous 46-degree gaps at left & right) -->
