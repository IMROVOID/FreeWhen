<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-test-equalizer">
  <title id="title-test-equalizer">FreeWhen — The Fairness Equalizer</title>
  <!-- Two bold horizontal stadium pills (Fairness / Equality) bridged by a central Meet Point sphere -->
  <g fill="#170E0A">
    <!-- Top Pill (Time Equality) -->
    <rect x="44" y="60" width="168" height="50" rx="25" />
    <!-- Bottom Pill (Place Equality) -->
    <rect x="44" y="146" width="168" height="50" rx="25" />
    <!-- Center Meet Point Node (The Consensus) -->
    <circle cx="128" cy="128" r="28" />
  </g>
</svg>
