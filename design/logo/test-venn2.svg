<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-venn2">
  <title id="title-venn2">FreeWhen — The Intersection Lens</title>
  <!-- Two bold circular rings (Time + Place) intersecting to frame the central Meet Point -->
  <g fill="none" stroke="#170E0A" stroke-width="32">
    <!-- Left Ring (When / Time) -->
    <circle cx="96" cy="128" r="62" />
    <!-- Right Ring (Where / Venue) -->
    <circle cx="160" cy="128" r="62" />
  </g>
  <!-- Central Intersection Core (The Agreement) -->
  <circle cx="128" cy="128" r="22" fill="#170E0A" />
</svg>
