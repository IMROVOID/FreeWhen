<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-dock">
  <title id="title-dock">FreeWhen — The Magnetic Dock</title>
  <!-- Two bold stadium pills converging on a central Meet Point sphere -->
  <g fill="#170E0A">
    <!-- Left pill with concave scoop at right -->
    <path fill-rule="evenodd" d="
      M 56 100
      H 104
      A 28 28 0 0 0 104 156
      H 56
      A 28 28 0 0 1 56 100 Z
    "/>
    <!-- Right pill with concave scoop at left -->
    <path fill-rule="evenodd" d="
      M 200 100
      H 152
      A 28 28 0 0 0 152 156
      H 200
      A 28 28 0 0 1 200 100 Z
    "/>
    <!-- Central Meet Point core -->
    <circle cx="128" cy="128" r="18" />
  </g>
</svg>
