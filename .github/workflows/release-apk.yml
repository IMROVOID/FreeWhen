name: Release APK

# Builds every requested ABI plus a universal APK, verifies each one, and
# publishes a GitHub Release — a DRAFT by default.
#
# ★ THIS CALLS `scripts/build/build-apk.sh`, IT DOES NOT REIMPLEMENT IT.
#
# The script owns the gates, the `expo prebuild` and the Gradle invocation, and
# `tests/deploy/gates.test.ts` pins its ordering precisely. This workflow
# supplies environment and calls it, so there is one definition of "how an APK
# is built" rather than two that drift.
#
# ★ THE CONFIG COMES FROM `_resolve-config.yml`.
#
# Every knob resolves through one precedence chain (dispatch input → repo
# variable → `[fw:…]` commit flag → default) implemented once, with validation.
# Re-deriving it here would put the order in two places.

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'ABIs: all, or a comma list of armeabi-v7a, arm64-v8a, x86, x86_64.'
        required: false
        default: ''
      universal:
        description: 'Also build the universal APK.'
        required: false
        default: ''
        type: choice
        options: ['', 'true', 'false']
      release_mode:
        description: 'draft (reversible) or publish (public).'
        required: false
        default: ''
        type: choice
        options: ['', 'draft', 'publish']
      version:
        description: 'x.y.z. Blank reads app.json.'
        required: false
        default: ''
      mode:
        description: 'production validates the server URL before building.'
        required: false
        default: ''
        type: choice
        options: ['', 'production', 'development']
      ref:
        description: 'Branch or tag to build. Blank = this ref.'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # ── 0. Does this push build? ──────────────────────────────────────────────
  guard:
    name: Decide whether to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A push builds only when the commit asks for it. `publish` is not
          # reachable from here: a push that publishes is a blast radius a
          # commit flag should not be able to open.
          if printf '%s' "${MSG:-}" | grep -qiE '\[fw:apk\]'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo '::notice::[fw:apk] found; building.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No [fw:apk] in the commit message; not building.'
          fi

  # ── 1. Resolve every knob, in one place ──────────────────────────────────
  resolve:
    name: Resolve config
    needs: guard
    if: needs.guard.outputs.run == 'true'
    uses: ./.github/workflows/_resolve-config.yml
    with:
      scope: apk
      commit_message: ${{ github.event.head_commit.message }}
      d_archs: ${{ inputs.archs }}
      d_universal: ${{ inputs.universal }}
      d_release_mode: ${{ inputs.release_mode }}
      d_version: ${{ inputs.version }}
      d_mode: ${{ inputs.mode }}
    secrets: inherit

  # ── 2. Refuse to build what cannot work, before Gradle runs ───────────────
  preflight:
    name: Preflight
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the signing secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=Missing keystore::ANDROID_KEYSTORE_BASE64 is unset."
            echo "The keystore is the whole update path: Android refuses an update signed"
            echo "by a different key, so a build without it produces an app that cannot be"
            echo "installed over the one already on a participant's phone."
            missing=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing keystore password::ANDROID_KEYSTORE_PASSWORD is unset."
            missing=1
          fi
          # ★ CHECKED HERE RATHER THAN 15 MINUTES INTO GRADLE.
          #
          # `react-native-maps` initialises the Google Maps SDK when a MapView is
          # created, before `mapType` is consulted, so without this key EVERY map
          # screen crashes the app — that defect shipped in a draft because nothing
          # checked for it until a phone opened a map. The config plugin also refuses
          # to prebuild without it; failing in preflight makes the cause obvious in
          # the first few seconds of the run.
          if [ -z "$MAPS_KEY" ]; then
            echo "::error title=Missing map key::GOOGLE_MAPS_API_KEY is unset."
            echo "react-native-maps initialises the Google Maps SDK on Android even with"
            echo "mapType=\"none\", and the app crashes on any map screen without it."
            echo "MapBox still draws every tile; this key only authorises the SDK host."
            missing=1
          fi
          exit "$missing"

      # ★ THE VERSION IS ASSERTED, NOT PATCHED.
      #
      # Rewriting `app.json` in a scratch commit would make the tag and the
      # artifact agree while leaving the repository's version behind, and the
      # next build would silently revert. Failing means the version is bumped
      # where a reader can see it.
      - name: The version agrees with app.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error title=Version mismatch::asked for $VERSION but app.json says $APP_VERSION."
            echo "Bump app.json's expo.version to $VERSION, commit, and re-run — or dispatch"
            echo "with the version app.json already carries."
            exit 1
          fi
          echo "version: $APP_VERSION"

      # ★ THE PRODUCTION GATE: PROVE THE SERVER BEFORE INLINING ITS URL.
      #
      # `EXPO_PUBLIC_APP_BASE_URL` is substituted at build time, and the app
      # resolves its API origin from it. A production APK built against a dead
      # host opens to a spinner on a stranger's phone and cannot be fixed
      # without shipping another APK — so this runs before the build, not after.
      - name: Validate the server URL (production only)
        if: needs.resolve.outputs.mode == 'production'
        env:
          SERVER_URL: ${{ vars.FREEWHEN_SERVER_URL }}
          DEMO_TOKEN: ${{ vars.FREEWHEN_DEMO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_URL" ]; then
            echo "::error title=No server URL::production build cancelled: FREEWHEN_SERVER_URL is unset."
            echo "The APK inlines its API origin at build time. Set the repository variable"
            echo "FREEWHEN_SERVER_URL, or dispatch with mode=development."
            exit 1
          fi
          URL="${SERVER_URL%/}"

          # ★ THE PROBE MUST USE THE SAME PATH THE APP DOES.
          #
          # `server/app.ts` registers the handler twice: Caddy answers the bare
          # `/health` because a reverse proxy wants a short path, and the API
          # answers `/api/health`. The serverless targets serve the function at
          # `/api/...` only, so probing bare `/health` found a 404 page and
          # cancelled a perfectly healthy production build. `verify-deployment.sh`
          # already curls `/api/health`; this now matches it.
          echo "checking $URL/api/health"
          BODY="$(curl -fsS --retry 3 --max-time 15 "$URL/api/health" || true)"
          if ! printf '%s' "$BODY" | grep -q '"db":"up"'; then
            echo "::error title=Server not healthy::production build cancelled: server URL not reachable, or its database is down."
            echo "GET $URL/api/health answered: ${BODY:-<no response>}"
            echo 'Expected a body containing "db":"up".'
            exit 1
          fi
          echo "health: $BODY"

          if [ -n "$DEMO_TOKEN" ]; then
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --max-time 15 "$URL/e/$DEMO_TOKEN" || echo 000)"
            if [ "$CODE" != "200" ]; then
              echo "::error title=Reviewer path broken::/e/<demo token> answered $CODE, expected 200."
              exit 1
            fi
            echo "reviewer path: 200"
          else
            echo "::warning::FREEWHEN_DEMO_TOKEN is unset — the reviewer path was not checked"
          fi

  # ── 3. One job per ABI, plus the universal build ─────────────────────────
  build:
    name: Build ${{ matrix.arch }}
    # ★ `build` DEPENDS ON `preflight`, AND THAT WAS MISSING.
    #
    # Without it the job had no dependency in the graph, so `release` could reach
    # `needs.build.result` while `build` had not been scheduled — the result read
    # as neither `success` nor `skipped`, the `always()` guard passed, and
    # `Publish` ran against an empty `release/` directory:
    #
    #   cd: release: No such file or directory
    #
    # Preflight exists to refuse a build that cannot work; running the build
    # before it decided was the bug behind the bug.
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    # A universal build compiles FOUR ABIs in one Gradle run and exceeded the old
    # 60-minute ceiling, which cancelled the job AFTER it had done the work.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # A single bad ABI must not cancel the others: the run is worth finishing
      # so the log names which artifact failed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ★ THE FIVE JOBS ARE INDEPENDENT, SO THE EXPENSIVE PART IS NOT CPU — IT IS
      # THE FIRST RUN OF A COLD BUILD.
      #
      # Every matrix job used to compile the Expo/React Native Gradle plugin
      # stack from source before touching the app: roughly ten minutes of the
      # twenty-five, repeated five times. `setup-gradle` restores that from a
      # cache keyed on the build files, and reads and writes the cache across
      # jobs in the same run.
      - uses: gradle/actions/setup-gradle@v4
        with:
          # A shared key so the per-ABI jobs warm each other rather than five
          # independent cold caches.
          cache-read-only: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ★ GRADLE PLUS FOUR ABIs DOES NOT FIT IN THE DEFAULT RUNNER IMAGE.
      #
      # The universal build died with
      #
      #   System.IO.IOException: No space left on device
      #
      # after compiling, which then cancelled the job and took `Publish` with it.
      # The default Ubuntu image ships ~14 GB free and about half of it is
      # preinstalled toolchains this project never uses. Removing the largest of
      # them frees several gigabytes for the NDK/Gradle caches the build needs.
      #
      # This is a reclaim, not a gamble: everything listed is re-installable and
      # the job would otherwise be operating at the edge of the disk the whole
      # time.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/microsoft \
            2>/dev/null || true
          sudo apt-get clean || true
          echo "--- after reclaim ---"
          df -h / | tail -1

      - name: Install dependencies
        run: npm ci

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, not the workspace: the workspace is what
          # `upload-artifact` zips and what the Gradle cache hashes.
          KEYSTORE_PATH="$RUNNER_TEMP/freewhen-release.keystore"
          # `set -x` stays off around the decode: this is the one line whose
          # expansion is the secret itself.
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::the decoded keystore is empty — ANDROID_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ★ THE STEP HAS AN `id`, SO ITS OUTPUT IS THE BUILD'S REAL RESULT.
      #
      # `build-apk.sh` writes `apk_path` (the Gradle output), `apk_sha256` and
      # `apk_size` to `$GITHUB_OUTPUT`. Everything downstream reads THOSE rather
      # than a fixed filename — see "Stage the verified artifact" below.
      - name: Build
        id: build
        env:
          # ★ NOT `cond && '' || other`. An empty string is FALSY in GitHub
          # expressions, so `matrix.arch == 'universal' && '' || matrix.arch`
          # fell through to the right-hand side and passed the literal string
          # `universal` — which then reached
          # `-PreactNativeArchitectures=universal`, and Gradle refused the whole
          # build with `[CXX1201] ABIs [universal] are not supported`.
          #
          # `build-apk.sh` treats `universal` as "every ABI, un-suffixed
          # output", so the value is passed through as-is and the script decides.
          APK_ARCHS: ${{ matrix.arch }}
          UNIVERSAL_APK: ${{ matrix.arch == 'universal' && '1' || '0' }}
          FREE_WHEN_RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          FREE_WHEN_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FREE_WHEN_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FREE_WHEN_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_APP_BASE_URL: ${{ vars.FREEWHEN_APP_BASE_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.FREEWHEN_SERVER_URL }}
          EXPO_PUBLIC_DEMO_TOKEN: ${{ vars.FREEWHEN_DEMO_TOKEN }}
          # The MapBox token draws every visible tile.
          EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN: ${{ vars.FREEWHEN_MAPBOX_PUBLIC_TOKEN }}
          EXPO_PUBLIC_TILE_STYLE_URL: ${{ vars.FREEWHEN_TILE_STYLE_URL }}
          # ★ THE GOOGLE KEY AUTHORISES THE SDK, NOT THE BASEMAP.
          #
          # `react-native-maps` initialises the Google Maps SDK when a MapView is
          # created, before `mapType` is consulted, so the APK cannot open a map
          # screen without this key — it died with "API key not found" when this was
          # missing. MapBox still renders every pixel; see
          # `plugins/with-google-maps-key.js`.
          #
          # A SECRET, not a variable: unlike the publishable MapBox token this one is
          # restricted by package name and signing certificate, and Google bills per
          # map load. The plugin fails `prebuild` when it is absent, so a release
          # cannot ship a crashing map.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bash scripts/build/build-apk.sh

      # ★ THIS STEP USED TO RUN **BEFORE** THE VERIFY STEP, AND THAT IS THE BUG.
      #
      # It copied `web/dl/freewhen.apk` — a STAGED copy in a static root where a
      # developer's own build survives between runs — while `Validate` then
      # checked the same stale file and reported it as signed and correct. On
      # 0.1.3 that file was an unsigned build from the previous day, so every
      # published APK was unsigned while the log showed a clean verification.
      #
      # Three things changed:
      #
      #   1. `Stage` runs AFTER `Verify`, so the bytes inspected are the bytes
      #      uploaded. The order is the safety property, exactly as it is in
      #      `deploy.sh` (gates → export → gate:web → rsync).
      #   2. The source is `steps.build.outputs.apk_path` — the artifact Gradle
      #      just wrote — not a path in the tree.
      #   3. The staged file's digest is compared with the one the build
      #      reported, so a copy that silently picked up a different file fails
      #      here instead of shipping.
      - name: Locate the Android SDK
        id: sdk
        run: |
          set -euo pipefail
          # ★ `ANDROID_HOME` IS NOT SET ON THE RUNNER, AND GRADLE DOES NOT NEED IT.
          #
          # Gradle provisions what it needs from the preinstalled SDK, so the
          # BUILD succeeded while the VERIFY step reported
          #
          #   SKIP signature check: apksigner not found under
          #   cannot verify a release signature without apksigner
          #
          # — and with REQUIRE_RELEASE_SIGNING=1 that skip is a hard failure.
          # The signature is the whole update path, so the check must run rather
          # than be waived: the SDK location is resolved here and passed on.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk; do
              [ -d "$candidate" ] && SDK="$candidate" && break
            done
          fi
          [ -n "$SDK" ] || { echo "::error::no Android SDK found; cannot verify the APK signature"; exit 1; }

          # ★ A GUESS AT THE LOCATION IS NOT A GUARANTEE OF THE BINARY.
          #
          # The runner image decides which build-tools are installed, and a hard
          # -coded list goes stale. If `apksigner` is absent it is installed now
          # rather than skipped — a release whose signature nobody checked would
          # install over nothing and fail to update in the field.
          if ! ls "$SDK"/build-tools/*/apksigner >/dev/null 2>&1; then
            echo "no apksigner under $SDK — installing build-tools"
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null 2>&1 || true
            fi
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "SDK: $SDK"
          ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 \
            || { echo "::error::no apksigner under $SDK — the signature check cannot run"; exit 1; }

      - name: Verify the APK
        env:
          # ★ THE BUNDLE-URL CHECK IS THE ONE THAT CATCHES A SILENTLY EMPTY VAR.
          #
          # An APK whose inlined server URL is empty builds fine and throws on
          # launch. Passing the expected host makes validate-apk.sh grep the
          # bundle for it.
          EXPECTED_HOST: ${{ needs.resolve.outputs.mode == 'production' && vars.FREEWHEN_SERVER_URL || '' }}
          REQUIRE_RELEASE_SIGNING: '1'
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
          # ★ EACH JOB WRITES ITS OWN MANIFEST.
          #
          # All five wrote `SHA256SUMS.txt` into their own artifact, and
          # `download-artifact` with `merge-multiple` puts same-named files in
          # one directory — so four were silently overwritten and the published
          # manifest carried a single line. A manifest that names one of five
          # APKs is worse than none: it looks like a verification aid.
          SUMS_FILE: SHA256SUMS-${{ matrix.arch }}.txt
          # ★ THE MANIFEST NAMES THE FILE THAT WILL BE PUBLISHED.
          #
          # `validate-apk.sh` used to derive the name from the path it was given.
          # That path is now Gradle's `app-release.apk`, so the manifest would
          # have listed a filename the release never carries and the publish
          # job's `sha256sum -c` would fail on every entry.
          PUBLISHED_NAME: FreeWhen-v${{ needs.resolve.outputs.version }}-${{ matrix.arch }}.apk
        run: |
          set -euo pipefail

          # ★ VALIDATE THE ARTIFACT THE BUILD PRODUCED, NOT A COPY IN THE TREE.
          #
          # This read `steps.name.outputs.path` — the file staged out of
          # `web/dl/` — so it verified a stale copy and never touched the APK
          # Gradle had just written. On 0.1.3 that copy was unsigned and the
          # check passed anyway, because the two files were different.
          APK="${{ steps.build.outputs.apk_path }}"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error title=Nothing to verify::build-apk.sh reported no apk_path."
            exit 1
          fi

          # Write the manifest under the matrix arch's own name, so the release
          # job can merge five of them into one.
          : > "$SUMS_FILE"

          bash .github/scripts/validate-apk.sh \
            "$APK" \
            "${{ matrix.arch }}" \
            "${EXPECTED_HOST%/}"

      - name: Stage the verified artifact
        id: name
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILT_PATH: ${{ steps.build.outputs.apk_path }}
          BUILT_SHA: ${{ steps.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail

          # ★ AN EMPTY OUTPUT IS A FAILURE, NOT A FALLBACK.
          #
          # Falling back to `web/dl/freewhen.apk` here would reintroduce the exact
          # defect this step exists to remove. If the build did not report its
          # artifact, nothing is safe to publish.
          if [ -z "${BUILT_PATH:-}" ]; then
            echo "::error title=No build output::build-apk.sh did not report apk_path; refusing to guess a filename."
            echo "Publishing a copy from web/dl/ is how unsigned APKs reached the 0.1.3 release."
            exit 1
          fi
          if [ ! -f "$BUILT_PATH" ]; then
            echo "::error title=Missing artifact::build reported '$BUILT_PATH' but it does not exist."
            exit 1
          fi

          TARGET="FreeWhen-v${VERSION}-${ARCH}.apk"
          cp "$BUILT_PATH" "$TARGET"

          ACTUAL="$( { sha256sum "$TARGET" 2>/dev/null || shasum -a 256 "$TARGET"; } | cut -d' ' -f1)"
          if [ -n "${BUILT_SHA:-}" ] && [ "$ACTUAL" != "$BUILT_SHA" ]; then
            echo "::error title=Artifact changed::copied digest $ACTUAL != built digest $BUILT_SHA"
            exit 1
          fi

          echo "  staged $TARGET from $BUILT_PATH"
          echo "  sha256 $ACTUAL"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "name=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          # The checksum travels with the artifact so the release job can
          # re-verify from scratch rather than trusting a digest that crossed a
          # job boundary.
          path: |
            ${{ steps.name.outputs.path }}
            SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  # ── 4. Publish: draft by default, publish on request ─────────────────────
  release:
    name: Publish ${{ needs.resolve.outputs.release_mode }}
    needs: [resolve, build]
    # ★ ONE FAILED ABI MUST NOT VOID THE ONES THAT BUILT.
    #
    # `needs: [build]` skips this job unless EVERY matrix job succeeded, so a
    # single cancelled or failed ABI discarded four good APKs — a run that had
    # already done the work published nothing.
    #
    # The check is on `build` having FINISHED, not on it having succeeded. A
    # bare `always()` is wrong: it starts this job the moment `resolve` is done,
    # so it tried to publish before any APK existed. The checksums step below
    # still refuses an empty or unverifiable set, so this widens what MAY be
    # published, not what is ALLOWED to be.
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ★ `merge-multiple` IS WHAT MAKES THE UPLOAD CORRECT.
      #
      # Each matrix job uploads a zip containing the APK and its checksum line.
      # Without this, `gh release upload` receives five zips — and a release
      # whose assets are archives is a download nobody can install.
      - name: Collect the artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Re-verify every checksum
        run: |
          set -euo pipefail
          # ★ SAY WHY, RATHER THAN LETTING `cd` FAIL.
          #
          # The directory is absent when no build produced an artifact — every
          # matrix job failed, or none ran. `cd: release: No such file or
          # directory` names a path instead of the problem.
          if [ ! -d release ]; then
            echo "::error title=Nothing to publish::no build uploaded an artifact, so there is no release to create."
            exit 1
          fi
          cd release
          ls -la

          # ★ COMBINE THE PER-ABI MANIFESTS INTO ONE.
          #
          # Each matrix job writes `SHA256SUMS-<arch>.txt`. Merging them here is
          # what makes the published manifest cover every APK — reading a single
          # shared name would have kept whichever job finished last.
          shopt -s nullglob
          parts=(SHA256SUMS-*.txt)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "::error title=Nothing to publish::no per-ABI checksum manifest was uploaded."
            exit 1
          fi
          cat "${parts[@]}" | sort -u > SHA256SUMS.txt
          rm -f "${parts[@]}"

          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo "verified $(ls -1 ./*.apk 2>/dev/null | wc -l | tr -d ' ') APK(s)"

      # ★ A DIGEST MATCH PROVES NOTHING ABOUT WHETHER THE APK IS INSTALLABLE.
      #
      # v0.1.3 published five unsigned APKs whose checksums all matched a
      # well-formed manifest — every file was intact, and every file was
      # uninstallable (`INSTALL_PARSE_FAILED_NO_CERTIFICATES`, then Play
      # Protect's "Installation blocked by profile policy"). `sha256sum -c`
      # answers "is this the file the build made?", not "can a phone install it".
      #
      # This is the last gate before bytes go public, so it asks the second
      # question directly, with no skip path.
      - name: Refuse to publish an unsigned APK
        run: |
          set -euo pipefail
          cd release

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk; do
              [ -d "$candidate" ] && SDK="$candidate" && break
            done
          fi
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error title=No apksigner::cannot prove the uploaded APKs are signed; refusing to publish."
            exit 1
          fi

          shopt -s nullglob
          status=0
          for apk in ./*.apk; do
            if OUT="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"; then
              echo "  SIGNED   $apk"
            else
              echo "::error title=Unsigned APK::$apk is not signed — a phone cannot install it."
              printf '%s\n' "$OUT" | head -3 | sed 's/^/           /'
              status=1
            fi
          done

          [ "$status" -eq 0 ] || exit 1
          echo "all APKs carry a valid signature"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
          OVERWRITE_TAG: ${{ vars.FREEWHEN_OVERWRITE_RELEASE }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES="release-notes.md"

          {
            echo "## FreeWhen $TAG"
            echo ""
            echo "Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%d)."
            echo ""
            echo "Install the \`universal\` APK if you are unsure which ABI your phone"
            echo "needs; a per-ABI APK saves space. Every file's SHA-256 is in"
            echo "\`SHA256SUMS.txt\` — verify with \`sha256sum -c SHA256SUMS.txt\`."
            echo ""
            echo "Android will warn that this app is from an unknown developer. That is"
            echo "expected: it is signed with FreeWhen's own release key, not distributed"
            echo "through Play."
          } > "$NOTES"

          EXISTS=0
          if gh release view "$TAG" >/dev/null 2>&1; then EXISTS=1; fi

          if [ "$RELEASE_MODE" = "draft" ]; then
            if [ "$EXISTS" = "1" ]; then
              # A draft is REBUILT, not re-created: `gh release create` fails when
              # the tag exists, and swallowing that with `|| true` leaves the old
              # draft's assets beside the new ones.
              echo "draft $TAG exists — replacing its assets"
              gh release delete-asset "$TAG" --yes '*FreeWhen-*.apk' 2>/dev/null || true
              gh release delete-asset "$TAG" --yes 'SHA256SUMS.txt' 2>/dev/null || true
              gh release edit "$TAG" --draft --prerelease --title "FreeWhen $TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" --draft --prerelease --title "FreeWhen $TAG" --notes-file "$NOTES"
            fi
            gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt --clobber
          else
            if [ "$EXISTS" = "1" ]; then
              if [ "$OVERWRITE_TAG" != "true" ]; then
                echo "::error title=Release exists::release $TAG already exists and FREEWHEN_OVERWRITE_RELEASE is not 'true'."
                echo "Set that repository variable to overwrite a published release, or dispatch"
                echo "with a version that has not been released."
                exit 1
              fi
              echo "overwriting $TAG"
              gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt --clobber
              gh release edit "$TAG" --title "FreeWhen $TAG" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --title "FreeWhen $TAG" --notes-file "$NOTES" --latest \
                release/*.apk release/SHA256SUMS.txt
            fi
          fi

      # ★ `/dl/freewhen.apk` IS NOT UPDATED FROM HERE.
      #
      # The stable download URL is served from the deployment host's static
      # root, and the only sanctioned writer is the deploy path, which orders
      # export → gate:web → rsync. Copying an APK onto the host from a release
      # workflow would publish to a path that bypassed that scan.
      - name: What still needs doing
        if: needs.resolve.outputs.release_mode == 'publish'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ### The stable download path was not updated

          This workflow published the GitHub Release only. `https://<host>/dl/freewhen.apk`
          is served from the deployment host's static root, and the only supported way
          to write it is the **Deploy** workflow (or `scripts/deploy/deploy.sh`), which
          orders `export → gate:web → rsync`.

          Run **Deploy** with `web=true` to refresh the stable URL.
          MD
