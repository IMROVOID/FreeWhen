name: Deploy VPS

# ★ THE HOST THAT ALREADY WORKS, AUTOMATED WITHOUT BYPASSING ITS ORDERING.
#
# `scripts/deploy/deploy.sh` runs gates → export → `gate:web` → rsync → migrate
# → reload → smoke, and `tests/deploy/gates.test.ts` asserts that ordering
# precisely. This workflow does not replace it: for the static half it runs the
# same `export-web.sh`, and for the backend it uses the Compose file the repo
# already ships.
#
# ★ TWO PATHS ON ONE HOST.
#
#   self-contained  — Compose brings up Postgres + api + realtime
#                     (`docker-compose.deploy.yml`), for a host that has none.
#   external_db     — the operator supplies DATABASE_URL (Neon, Supabase,
#                     managed Postgres); only api + realtime start.
#
# The Caddy config is unchanged either way: it proxies to 127.0.0.1:8787 and
# 127.0.0.1:8788, which is what both paths publish.

on:
  workflow_call:
    inputs:
      mode:
        description: 'production or preview.'
        required: false
        type: string
        default: 'production'
      web:
        description: 'Deploy the static web export.'
        required: false
        type: boolean
        default: true
      api:
        description: 'Deploy the backend.'
        required: false
        type: boolean
        default: true
      run_migrations:
        description: 'Apply migrations.'
        required: false
        type: boolean
        default: true
      external_db:
        description: 'Use an external DATABASE_URL instead of the bundled Postgres.'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Branch or tag to deploy.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  REMOTE_APP_DIR: /srv/app
  REMOTE_WEB_ROOT: /srv/web
  REMOTE_STATIC_ROOT: /srv/static

jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ★ AN APPROVAL ENVIRONMENT FOR PRODUCTION.
    #
    # `mode=preview` runs unattended; `production` waits for a human. The blame
    # for a bad production deploy should attach to a person who clicked.
    environment: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── The static half ───────────────────────────────────────────────────
      # ★ THE EXPORT RUNS HERE, NOT ON THE HOST.
      #
      # `EXPO_PUBLIC_*` is inlined at export time and must exist in *this*
      # shell — putting it in the host's environment produces a bundle whose
      # `/start` renders "not configured". That is the same reason
      # `scripts/build/export-web.sh:28-33` warns about it.
      - name: Build the web export
        if: inputs.web
        env:
          EXPO_PUBLIC_APP_BASE_URL: ${{ vars.FREEWHEN_APP_BASE_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.FREEWHEN_SERVER_URL }}
          EXPO_PUBLIC_DEMO_TOKEN: ${{ vars.FREEWHEN_DEMO_TOKEN }}
          EXPO_PUBLIC_MAPBOX_PUBLIC_TOKEN: ${{ vars.FREEWHEN_MAPBOX_PUBLIC_TOKEN }}
          EXPO_PUBLIC_TILE_STYLE_URL: ${{ vars.FREEWHEN_TILE_STYLE_URL }}
        run: bash scripts/build/export-web.sh

      # ── SSH, with a pinned host key ───────────────────────────────────────
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.FREEWHEN_SSH_PORT }}
          PINNED_FINGERPRINT: ${{ vars.FREEWHEN_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          # ★ `ssh-keyscan` ALONE IS NOT A VERIFICATION.
          #
          # Scanning the key and then trusting it accepts whatever answers,
          # which is the attack host-key checking exists to prevent. The scan
          # populates `known_hosts`; the PINNED_FINGERPRINT comparison below is
          # what actually proves the host is the intended one.
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null

          if [[ -n "$PINNED_FINGERPRINT" ]]; then
            ACTUAL="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | head -1)"
            if [[ "$ACTUAL" != "$PINNED_FINGERPRINT" ]]; then
              echo "::error::host key fingerprint mismatch."
              echo "  expected: $PINNED_FINGERPRINT"
              echo "  actual:   $ACTUAL"
              echo "If the host was legitimately rebuilt, update vars.FREEWHEN_SSH_HOST_FINGERPRINT."
              exit 1
            fi
            echo "host key verified against the pinned fingerprint"
          else
            # Refusing here rather than proceeding is the whole point: an
            # unpinned deploy is a deploy to whatever answers on that address.
            echo "::error::vars.FREEWHEN_SSH_HOST_FINGERPRINT is unset."
            echo "Run: ssh-keyscan -p ${PORT} ${SSH_HOST} | ssh-keygen -lf - -E sha256"
            echo "and store the result as the repository variable. Deploying without it"
            echo "trusts whatever answers on that address."
            exit 1
          fi

          {
            echo "DEPLOY_TARGET=${SSH_HOST}"
            echo "SSH_PORT=${PORT}"
          } >> "$GITHUB_ENV"

      - name: Initialize the SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # ── Render .env on the host ───────────────────────────────────────────
      # ★ THE VALUES NEVER LAND IN THE REPOSITORY.
      #
      # The file is written over ssh with `umask 077`, so it is 0600 from the
      # moment it exists. `docker-compose.deploy.yml` reads these by name and
      # refuses to start without the required ones (`:?`), which is why they
      # are validated below before `compose up` rather than after it fails.
      - name: Write the host environment file
        if: inputs.api
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NESHAN_MATRIX_API_KEY: ${{ secrets.NESHAN_MATRIX_API_KEY }}
          NESHAN_DIRECTION_API_KEY: ${{ secrets.NESHAN_DIRECTION_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_BASE_URL: ${{ vars.FREEWHEN_SERVER_URL }}
          APP_ORIGIN: ${{ vars.FREEWHEN_APP_BASE_URL }}
          EXTERNAL_DB: ${{ inputs.external_db }}
        run: |
          set -euo pipefail

          # Required by `docker-compose.deploy.yml` with `:?`, so a missing one
          # aborts `compose up` with a message that reads as "compose is broken".
          missing=()
          [[ -n "$JWT_SECRET" ]] || missing+=("JWT_SECRET")
          [[ -n "$PUBLIC_BASE_URL" ]] || missing+=("vars.FREEWHEN_SERVER_URL")
          if [[ "$EXTERNAL_DB" == "true" ]]; then
            [[ -n "$DATABASE_URL" ]] || missing+=("DATABASE_URL (external_db=true)")
          else
            [[ -n "$POSTGRES_PASSWORD" ]] || missing+=("POSTGRES_PASSWORD (self-contained)")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::the host environment is incomplete:"
            for item in "${missing[@]}"; do echo "::error::  - $item"; done
            exit 1
          fi

          # Values are written single-quoted with any embedded quote escaped, so
          # a password containing `$`, a space or a quote survives intact and is
          # never expanded by the remote shell.
          quote() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"; }

          {
            echo "umask 077"
            echo "mkdir -p $REMOTE_APP_DIR"
            echo "cat > $REMOTE_APP_DIR/.env <<'FREEWHEN_ENV_EOF'"
            echo "NODE_ENV=production"
            echo "PORT=8787"
            # ★ `0.0.0.0` IS NOT OPTIONAL.
            #
            # `server/index.ts` defaults to `127.0.0.1`, which inside a
            # container is unreachable from the host — the port looks open and
            # every request times out.
            echo "API_HOST=0.0.0.0"
            echo "PUBLIC_BASE_URL=$(quote "$PUBLIC_BASE_URL")"
            echo "APP_ORIGIN=$(quote "$APP_ORIGIN")"
            if [[ "$EXTERNAL_DB" == "true" ]]; then
              echo "DATABASE_BACKEND=local_pg"
              echo "DATABASE_URL=$(quote "$DATABASE_URL")"
            else
              echo "DATABASE_BACKEND=local_pg"
              echo "POSTGRES_PASSWORD=$(quote "$POSTGRES_PASSWORD")"
            fi
            echo "JWT_SECRET=$(quote "$JWT_SECRET")"
            [[ -n "$NESHAN_MATRIX_API_KEY" ]] && echo "NESHAN_MATRIX_API_KEY=$(quote "$NESHAN_MATRIX_API_KEY")"
            [[ -n "$NESHAN_DIRECTION_API_KEY" ]] && echo "NESHAN_DIRECTION_API_KEY=$(quote "$NESHAN_DIRECTION_API_KEY")"
            [[ -n "$ORS_API_KEY" ]] && echo "ORS_API_KEY=$(quote "$ORS_API_KEY")"
            [[ -n "$SUPABASE_URL" ]] && echo "SUPABASE_URL=$(quote "$SUPABASE_URL")"
            [[ -n "$SUPABASE_SECRET_KEY" ]] && echo "SUPABASE_SECRET_KEY=$(quote "$SUPABASE_SECRET_KEY")"
            echo "FREEWHEN_ENV_EOF"
            echo "chmod 600 $REMOTE_APP_DIR/.env"
          } | ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" bash -s

      # ── Ship the source and the static roots ──────────────────────────────
      - name: Sync the application source
        if: inputs.api
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # `--exclude .env` so a repository copy can never overwrite the
          # secrets rendered above. `--delete` is right for a generated tree,
          # and the `.env` exclusion keeps it from removing the rendered file.
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'node_modules' \
            --exclude 'dist' --exclude 'android' --exclude 'ios' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$DEPLOY_TARGET:$REMOTE_APP_DIR/"

      - name: Sync the static roots
        if: inputs.web
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # ★ TWO ROOTS, DELIBERATELY — the same split `deploy.sh:74-87` makes.
          #
          # `web/` is not merged into `dist/`: the app's client-side router would
          # shadow `/dl/` and `/privacy`, and those pages must load before any
          # JavaScript is agreed to.
          rsync -az --delete -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$DEPLOY_TARGET:$REMOTE_WEB_ROOT/"
          rsync -az -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            web/ "$SSH_USER@$DEPLOY_TARGET:$REMOTE_STATIC_ROOT/"

      # ── Start the backend ────────────────────────────────────────────────
      - name: Compose up
        if: inputs.api
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          EXTERNAL_DB: ${{ inputs.external_db }}
        run: |
          set -euo pipefail
          # ★ THE SERVICE LIST IS WHAT SELECTS THE PATH.
          #
          # `docker-compose.deploy.yml` declares three services (postgres, api,
          # realtime) and no profiles — it does not use them. Naming services on
          # the command line is what starts a subset, so:
          #
          #   external_db  -> "api realtime", reusing the operator's database
          #   bundled      -> no list at all, which starts all three
          #
          # `--build` is required because the image is built from the Dockerfile
          # in the tree that was just synced.
          if [[ "$EXTERNAL_DB" == "true" ]]; then
            SERVICES="api realtime"
          else
            SERVICES=""
          fi
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" \
            "cd $REMOTE_APP_DIR && docker compose -f docker-compose.deploy.yml up -d --build $SERVICES"

      - name: Apply migrations
        if: inputs.api && inputs.run_migrations
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # `db:migrate` is idempotent — it records what it applied, so a deploy
          # with no new migration is a no-op rather than a re-run.
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" \
            "cd $REMOTE_APP_DIR && docker compose -f docker-compose.deploy.yml exec -T api npm run db:migrate"

      - name: Wait for the API to report a healthy database
        if: inputs.api
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # ★ 30 × 5 s, AND THE BODY IS CHECKED, NOT JUST THE STATUS.
          #
          # `/health` answers 200 whenever the process is listening; `db:"up"` is
          # the assertion. A container that started but cannot reach Postgres is
          # the failure this catches — and it is the one that looks fine in
          # `docker compose ps`.
          for attempt in $(seq 1 30); do
            BODY="$(ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" \
              "curl -fsS --max-time 5 http://127.0.0.1:8787/health" 2>/dev/null || true)"
            if echo "$BODY" | grep -q '"db":"up"'; then
              echo "health: $BODY (after ${attempt} attempt(s))"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the API never reported db:\"up\" within 150s"
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" \
            "cd $REMOTE_APP_DIR && docker compose -f docker-compose.deploy.yml logs --tail=50 api" || true
          exit 1

      - name: Reload Caddy
        if: inputs.web || inputs.api
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # `--config` is explicit so a systemd default cannot point at a
          # different file than the one this repository ships.
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_TARGET" \
            "sudo caddy reload --config /etc/caddy/Caddyfile"

      # ── The contract, asserted from outside ──────────────────────────────
      # ★ THIS LIST MUST NOT DRIFT FROM `scripts/deploy/deploy.sh:117-127`.
      #
      # The refusals matter as much as the served paths: a refused path
      # returning 200 means an admin UI or a pruned service is reachable, and
      # that is the direction nobody notices.
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.FREEWHEN_SERVER_URL }}
          DEMO_TOKEN: ${{ vars.FREEWHEN_DEMO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" ]]; then
            echo "::error::vars.FREEWHEN_SERVER_URL is unset — the smoke test has no target."
            exit 1
          fi
          BASE="${BASE_URL%/}"
          fail=0

          check() {
            local description="$1" url="$2" want="$3" got
            got="$(curl -o /dev/null -s -w '%{http_code}' --max-time 15 --retry 2 "$url" || echo 000)"
            if [[ "$got" == "$want" ]]; then
              printf '   %-34s %s\n' "$description" "$got"
            else
              printf '   %-34s %s (want %s)  <- FAILED\n' "$description" "$got" "$want"
              fail=1
            fi
          }

          check "/health"            "$BASE/health"            200
          check "/start"             "$BASE/start"             200
          check "/privacy"           "$BASE/privacy"           200
          check "/dl/"               "$BASE/dl/"               200
          check "/api/health"        "$BASE/api/health"        200
          check "/studio (refused)"           "$BASE/studio"                 404
          check "/storage/v1/x (refused)"     "$BASE/storage/v1/object/x"    404
          check "/functions/v1/x (refused)"   "$BASE/functions/v1/x"         404
          check "/assets/x.js.map (refused)"  "$BASE/assets/x.js.map"        404

          # The demo must read WITHOUT a session and must not mint one: every
          # anonymous sign-in spends a request from a 30/hour/IP budget, so a
          # room of reviewers behind one address would exhaust it.
          if [[ -n "$DEMO_TOKEN" ]]; then
            check "/e/<demo> (no session)" "$BASE/e/$DEMO_TOKEN" 200
          else
            echo "   /e/<demo>                          skipped — FREEWHEN_DEMO_TOKEN unset"
          fi

          if [[ "$fail" -ne 0 ]]; then
            echo "::error::the smoke test failed — the deploy is published but the contract is not met."
            exit 1
          fi
          echo "deploy: published and the contract holds."
